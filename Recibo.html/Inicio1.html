<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recibo – Green & Blue Aguamarine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e8e8e8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .recibo-wrapper {
      background: #d6f0f0;
      border: 1.5px solid #4ab8c4;
      border-radius: 4px;
      width: 680px;
      padding: 18px 22px 22px 22px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.15);
    }

    /* ─── HEADER ─── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    /* Logo */
    .logo-block {}
    .logo-line1 {
      font-size: 28px;
      font-weight: 900;
      font-family: Arial Black, Arial, sans-serif;
      line-height: 1;
    }
    .logo-green { color: #3aaa35; }
    .logo-sym   { color: #3aaa35; font-size: 22px; }
    .logo-blue  { color: #1565c0; }
    .logo-line2 {
      font-size: 13px;
      font-weight: 700;
      color: #1565c0;
      letter-spacing: 3px;
      margin-top: -2px;
    }
    .logo-tagline {
      font-size: 9px;
      color: #555;
      margin-top: 3px;
      font-style: italic;
    }

    /* Services + phone (center) */
    .center-block {
      text-align: center;
      flex: 1;
      padding: 0 14px;
    }
    .services {
      display: flex;
      justify-content: center;
      gap: 14px;
      font-size: 10px;
      font-weight: 700;
      color: #1565c0;
      margin-bottom: 5px;
    }
    .services label {
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }
    .services input[type="checkbox"] {
      width: 11px;
      height: 11px;
      cursor: pointer;
      accent-color: #1565c0;
    }
    .phone {
      font-size: 11px;
      color: #1565c0;
      font-weight: bold;
    }
    .phone::before {
      content: "📱 ";
      font-size: 11px;
    }

    /* Recibo number (right) */
    .recibo-box {
      border: 2px solid #1565c0;
      border-radius: 4px;
      text-align: center;
      padding: 4px 14px;
      min-width: 110px;
    }
    .recibo-label {
      font-size: 11px;
      font-weight: 700;
      color: #1565c0;
      letter-spacing: 1px;
    }
    .recibo-num {
      font-size: 22px;
      font-weight: 700;
      color: #e53935;
      letter-spacing: 2px;
      margin-top: 2px;
    }
    .recibo-nro {
      font-size: 10px;
      color: #e53935;
      font-weight: bold;
    }

    /* ─── DATE ROW ─── */
    .date-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 10.5px;
      color: #333;
    }
    .date-row .date-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .date-row label { font-size: 10px; font-weight: 700; color: #1565c0; white-space: nowrap; }
    .date-row input[type="text"] {
      border: none;
      border-bottom: 1px solid #333;
      background: transparent;
      font-size: 11px;
      width: 28px;
      text-align: center;
      outline: none;
      color: #222;
    }
    .date-slash { font-size: 11px; color: #555; }

    /* ─── MAIN FIELDS ─── */
    .field-line {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      margin-bottom: 7px;
      font-size: 10.5px;
      color: #333;
    }
    .field-line label {
      font-size: 10.5px;
      font-weight: 700;
      color: #1565c0;
      white-space: nowrap;
    }
    .field-line input[type="text"] {
      border: none;
      border-bottom: 1px solid #333;
      background: transparent;
      font-size: 11px;
      outline: none;
      color: #222;
      flex: 1;
    }
    .field-line input.short { flex: 0 0 70px; }
    .field-line input.xshort { flex: 0 0 50px; }

    /* ─── DESCRIPTION TABLE ─── */
    .desc-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 0;
      font-size: 11px;
    }
    .desc-table th {
      background: transparent;
      color: #1565c0;
      font-weight: 700;
      font-size: 11.5px;
      border: 1.5px solid #4ab8c4;
      padding: 5px 8px;
      text-align: left;
    }
    .desc-table th.vr { text-align: right; white-space: nowrap; width: 90px; }
    .desc-table td {
      border: 1.5px solid #4ab8c4;
      padding: 0;
      vertical-align: top;
    }
    .desc-table td input[type="text"],
    .desc-table td textarea {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 11px;
      color: #222;
      outline: none;
      padding: 6px 8px;
      resize: none;
      font-family: Arial, sans-serif;
    }
    .desc-row td { height: 32px; }
    .desc-row td.vr-cell input { text-align: right; }

    /* Observaciones row */
    .obs-header td {
      padding: 5px 8px;
      font-weight: 700;
      font-size: 11.5px;
      color: #1565c0;
      border: 1.5px solid #4ab8c4;
    }
    .obs-body td {
      border: 1.5px solid #4ab8c4;
      padding: 0;
    }
    .obs-body textarea {
      width: 100%;
      border: none;
      background: transparent;
      resize: none;
      font-size: 11px;
      color: #222;
      padding: 6px 8px;
      outline: none;
      font-family: Arial, sans-serif;
      height: 55px;
    }

    /* Total row */
    .total-row td {
      border: 1.5px solid #4ab8c4;
      padding: 5px 8px;
      font-weight: 700;
      font-size: 12px;
      color: #1565c0;
    }
    .total-row td.total-label { text-align: right; }
    .total-row td.total-value {
      width: 90px;
      text-align: left;
    }
    .total-row td.total-value input {
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: #222;
      width: 100%;
      outline: none;
      padding: 0 4px;
    }

    /* ─── SIGNATURES ─── */
    .signatures {
      display: flex;
      justify-content: space-around;
      margin-top: 22px;
    }
    .sig-block {
      text-align: center;
      width: 200px;
    }
    .sig-block .sig-line {
      border-top: 1.5px solid #333;
      margin-bottom: 5px;
    }
    .sig-block .sig-label {
      font-size: 10px;
      font-weight: 700;
      color: #1565c0;
      letter-spacing: 0.5px;
    }

    /* print-friendly */
    @media print {
      body { background: white; padding: 0; }
      .recibo-wrapper { box-shadow: none; border: 1px solid #aaa; }
    }
  </style>
</head>
<body>
<div class="recibo-wrapper">

  <!-- ══ HEADER ══ -->
  <div class="header">

    <!-- Logo -->
    <div class="logo-block">
      <div class="logo-line1">
        <span class="logo-green">GREEN</span><span class="logo-sym">&</span><span class="logo-blue">BLUE</span>
      </div>
      <div class="logo-line2">a g u a m a r i n e</div>
      <div class="logo-tagline">Efecto y prevención en la funcionalidad física</div>
    </div>

    <!-- Services + Phone -->
    <div class="center-block">
      <div class="services">
        <label><input type="checkbox" name="servicio" value="rehabilitacion"> REHABILITACIÓN</label>
        <label><input type="checkbox" name="servicio" value="entretenimiento"> ENTRETENIMIENTO</label>
        <label><input type="checkbox" name="servicio" value="masajes"> MASAJES</label>
        <label><input type="checkbox" name="servicio" value="natacion"> NATACIÓN</label>
      </div>
      <div class="phone">318 868 8008 / 310 740 6038</div>
    </div>

    <!-- Recibo number -->
    <div class="recibo-box">
      <div class="recibo-label">RECIBO</div>
      <div style="display:flex; align-items:baseline; justify-content:center; gap:4px;">
        <span class="recibo-nro">N<sup>o</sup></span>
        <span class="recibo-num">0455</span>
      </div>
    </div>

  </div><!-- /header -->

  <!-- ══ DATES + DIRECCIÓN ══ -->
  <div class="date-row">
    <div class="date-group">
      <label>Fecha<br>Inicio</label>
      <input type="text" maxlength="2" placeholder="DD">
      <span class="date-slash">/</span>
      <input type="text" maxlength="2" placeholder="MM">
      <span class="date-slash">/</span>
      <input type="text" maxlength="4" placeholder="AAAA" style="width:40px">
    </div>
    <div class="date-group" style="margin-left:20px;">
      <label>Fecha<br>Finalización</label>
      <input type="text" maxlength="2" placeholder="DD">
      <span class="date-slash">/</span>
      <input type="text" maxlength="2" placeholder="MM">
      <span class="date-slash">/</span>
      <input type="text" maxlength="4" placeholder="AAAA" style="width:40px">
    </div>
    <div class="date-group" style="flex:1; margin-left:20px;">
      <label style="color:#1565c0; font-weight:700;">Dirección:</label>
      <input type="text" style="border:none; border-bottom:1px solid #333; background:transparent; flex:1; font-size:11px; outline:none; width:100%;">
    </div>
  </div>
  

  <!-- ══ SEÑOR(ES) ══ -->
  <div class="field-line">
    <label>Señor (es):</label>
    <input type="text" style="flex:2;">
  </div>

  <!-- ══ CIUDAD / EDAD / PESO / TALLA / PPL ══ -->
  <div class="field-line">
    <label>Ciudad:</label>
    <input type="text" class="short">
    <label>Edad:</label>
    <input type="text" class="xshort">
    <label>Peso:</label>
    <input type="text" class="xshort">
    <label>Talla:</label>
    <input type="text" class="xshort">
    <label>PPL:</label>
    <input type="text" class="xshort">
  </div>

  <!-- ══ TELÉFONO ══ -->
  <div class="field-line">
    <label>Teléfono:</label>
    <input type="text" style="flex:0 0 170px;">
  </div>

  <!-- ══ DESCRIPCIÓN TABLE ══ -->
  <table class="desc-table">
    <thead>
      <tr>
        <th>DESCRIPCIÓN</th>
        <th class="vr">VR. TOTAL</th>
      </tr>
    </thead>
    <tbody>
      <!-- 6 description rows -->
      <tr class="desc-row">
        <td><input type="text" placeholder=""></td>
        <td class="vr-cell"><input type="text" placeholder="$ "></td>
      </tr>
      <tr class="desc-row">
        <td><input type="text" placeholder=""></td>
        <td class="vr-cell"><input type="text" placeholder="$ "></td>
      </tr>
      <tr class="desc-row">
        <td><input type="text" placeholder=""></td>
        <td class="vr-cell"><input type="text" placeholder="$ "></td>
      </tr>
      <tr class="desc-row">
        <td><input type="text" placeholder=""></td>
        <td class="vr-cell"><input type="text" placeholder="$ "></td>
      </tr>
      <tr class="desc-row">
        <td><input type="text" placeholder=""></td>
        <td class="vr-cell"><input type="text" placeholder="$ "></td>
      </tr>
      <tr class="desc-row">
        <td><input type="text" placeholder=""></td>
        <td class="vr-cell"><input type="text" placeholder="$ "></td>
      </tr>

      <!-- OBSERVACIONES header -->
      <tr class="obs-header">
        <td colspan="2">OBSERVACIONES</td>
      </tr>
      <!-- OBSERVACIONES body -->
      <tr class="obs-body">
        <td colspan="2">
          <textarea placeholder=""></textarea>
        </td>
      </tr>

      <!-- TOTAL -->
      <tr class="total-row">
        <td class="total-label">TOTAL</td>
        <td class="total-value"><input type="text" placeholder="$"></td>
      </tr>
    </tbody>
  </table>

  <!-- ══ SIGNATURES ══ -->
  <div class="signatures">
    <div class="sig-block">
      <div class="sig-line"></div>
      <div class="sig-label">FIRMA DEL INSTRUCTOR</div>
    </div>
    <div class="sig-block">
      <div class="sig-line"></div>
      <div class="sig-label">FIRMA DEL USUARIO</div>
    </div>
  </div>

</div><!-- /recibo-wrapper -->
</body>
</html>
