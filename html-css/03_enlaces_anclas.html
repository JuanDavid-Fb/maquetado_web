<!DOCTYPE html>
< lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces</title>
    </head>    
<body>
    <!-- los enlaces o anclas o hipervínculos -->
    <!-- a (anchor) significa ancla. Metáfora: como un barco te mantiene en una ubicación especifica un ancla es justamente para que el usuario sepa hacia dónde buscar un recurso o hacia dónde navegar en la pagina web. -->

    <!-- Los atributos son caracteristicas que definen el comportamiento y la apariencia de los elementos en este caso el atributo href vuelve funcional a la etiqueta es por esta razón que su utiliza en el maquetado y no en el css dado que no es una caracteristica visual. -->

    <!-- href (hyper reference) es la referencia a un recurso, es decir, el destino del enlace. -->
    <!-- Lo que esta dentro de la etiqueta a es el texto visible que el usuario verá en la pagina web. Mientras que lo que está dentro de href es la referencia al recurso al que apunta el enlace. -->
    <h2 title="titulo de la página">Enlaces o Anclas</h2>
    <!-- Por otra parte, el atributo title proporciona un texto de ayuda que se muestra cuando el usuario pasa el mouse sobre el enlace. Las tecnologías  de asistencia como lectores de pantalla utilizan este atributo para proporcionar información adicional al usuario. En el caso de personas invidentes esto les permite acceder a información adicional sobre el enlace. -->
